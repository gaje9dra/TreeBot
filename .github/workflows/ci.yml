name: TreeBot CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treebot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-lockfile:
    name: Bootstrap dependency lockfile (one-time)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/') && !hashFiles('package-lock.json')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from the committed package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
  contract-tests:
    name: Foundry local EVM contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format Solidity sources
        run: forge fmt
      - name: Run restricted-vault local EVM tests
        run: forge test --root . -vvv
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -s package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Apply repository formatting
        run: npx prettier --write .
      - name: Verify formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and boundary tests
        run: npm test
      - name: Polygon RPC integration tests (explicitly gated; test RPC only)
        run: npm run test:integration
        env:
          TREEBOT_RUN_CHAIN_INTEGRATION: ${{ secrets.TREEBOT_RUN_CHAIN_INTEGRATION }}
          TREEBOT_INTEGRATION_RPC_URL: ${{ secrets.TREEBOT_INTEGRATION_RPC_URL }}
          TREEBOT_TEST_WALLET_ADDRESS: ${{ secrets.TREEBOT_TEST_WALLET_ADDRESS }}
          TREEBOT_TEST_SELL_TOKEN: ${{ secrets.TREEBOT_TEST_SELL_TOKEN }}
          TREEBOT_TEST_BUY_TOKEN: ${{ secrets.TREEBOT_TEST_BUY_TOKEN }}
          TREEBOT_TEST_TARGET: ${{ secrets.TREEBOT_TEST_TARGET }}
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_CHAIN_ID: 137
          TREEBOT_TRADING_MODE: paper
          TREEBOT_LIVE_TRADING_ENABLED: "false"
          TREEBOT_DEPOSITS_ENABLED: "false"
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -s package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full dependency tree
        run: |
          audit_status=0
          npm audit --json > npm-audit.json || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then
            cat npm-audit.json
            exit "$audit_status"
          fi
          node scripts/security-audit.mjs npm-audit.json

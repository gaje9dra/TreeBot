name: TreeBot CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treebot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Foundry local EVM contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format Solidity sources
        run: forge fmt
      - name: Run restricted-vault local EVM tests
        run: forge test --root . -vvv
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: treebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d treebot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/treebot_test
      TREEBOT_RUN_POSTGRES_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        run: npm run ledger:migrate:all
      - name: Apply repository formatting
        run: npx prettier --write .
      - name: Verify formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and boundary tests
        run: npm test
      - name: Polygon RPC integration tests (explicitly gated; test RPC only)
        run: npm run test:integration
        env:
          TREEBOT_RUN_CHAIN_INTEGRATION: ${{ secrets.TREEBOT_RUN_CHAIN_INTEGRATION }}
          TREEBOT_INTEGRATION_RPC_URL: ${{ secrets.TREEBOT_INTEGRATION_RPC_URL }}
          TREEBOT_TEST_WALLET_ADDRESS: ${{ secrets.TREEBOT_TEST_WALLET_ADDRESS }}
          TREEBOT_TEST_SELL_TOKEN: ${{ secrets.TREEBOT_TEST_SELL_TOKEN }}
          TREEBOT_TEST_BUY_TOKEN: ${{ secrets.TREEBOT_TEST_BUY_TOKEN }}
          TREEBOT_TEST_TARGET: ${{ secrets.TREEBOT_TEST_TARGET }}
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_CHAIN_ID: 137
          TREEBOT_TRADING_MODE: paper
          TREEBOT_LIVE_TRADING_ENABLED: "false"
          TREEBOT_DEPOSITS_ENABLED: "false"
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full dependency tree
        run: |
          audit_status=0
          npm audit --json > npm-audit.json || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then
            cat npm-audit.json
            exit "$audit_status"
          fi
          node scripts/security-audit.mjs npm-audit.json

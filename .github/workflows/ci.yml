name: TreeBot CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treebot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify formatting (read-only)
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and boundary tests
        run: npm test
      - name: Polygon RPC integration tests (explicitly gated; test RPC only)
        run: npm run test:integration
        env:
          TREEBOT_RUN_CHAIN_INTEGRATION: ${{ secrets.TREEBOT_RUN_CHAIN_INTEGRATION }}
          TREEBOT_INTEGRATION_RPC_URL: ${{ secrets.TREEBOT_INTEGRATION_RPC_URL }}
          TREEBOT_TEST_WALLET_ADDRESS: ${{ secrets.TREEBOT_TEST_WALLET_ADDRESS }}
          TREEBOT_TEST_SELL_TOKEN: ${{ secrets.TREEBOT_TEST_SELL_TOKEN }}
          TREEBOT_TEST_BUY_TOKEN: ${{ secrets.TREEBOT_TEST_BUY_TOKEN }}
          TREEBOT_TEST_TARGET: ${{ secrets.TREEBOT_TEST_TARGET }}
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_CHAIN_ID: 137
          TREEBOT_TRADING_MODE: paper
          TREEBOT_LIVE_TRADING_ENABLED: "false"
          TREEBOT_DEPOSITS_ENABLED: "false"
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full dependency tree
        run: npm audit --audit-level=high
